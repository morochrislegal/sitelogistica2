<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AlertaEmpresa - Dashboard</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div class="dashboard-container">

        <!-- CONTEÚDO PRINCIPAL (MAIN) -->
        <main class="main-content">
            <!-- Cabeçalho Principal -->
            <header class="main-header">
                <h1>Painel</h1>
                <div class="user-profile">
                    <!-- Detalhes do usuário Lucas Silva -->
                </div>
            </header>

            <!-- Cartões de Estatísticas (Cards) -->
            <section class="stats-cards">
                <div class="card critical">
                    <h3>TOTAL ALERTAS ATIVOS</h3>
                    <p class="value">21</p>
                    <p class="sub-value">(4 urgent)</p>
                </div>
                <!-- ... outros cards ... -->
            </section>

            <!-- Tabela de Alertas em Tempo Real -->
            <section class="alerts-table-section">
                <h2>ALERTAS EM TEMPO REAL</h2>
                <table class="alerts-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>TIPO</th>
                            <th>DESCRIÇÃO</th>
                            <th>GRAVIDADE</th>
                            <th>AÇÃO</th>
                        </tr>
                    </thead>
                    <tbody id="alerts-body">
                        <!-- Os dados virão do JavaScript aqui -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <!-- Script para carregar os dados dinamicamente -->
    <script src="app.js"></script>
</body>
</html>
